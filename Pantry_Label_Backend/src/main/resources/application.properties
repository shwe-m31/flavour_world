spring.application.name=pantry-label-backend
spring.datasource.url=${DB_URL:jdbc:h2:mem:pantry_label_db;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.hibernate.ddl-auto=none
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:sample_data.sql
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
app.jwt.secret=${JWT_SECRET:pantry-label-local-dev-secret-key-change-in-production-min64chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:dev@example.com}
spring.mail.password=${GMAIL_APP_PASSWORD:dev_placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.invoice.storage-path=${INVOICE_STORAGE_PATH:uploads/invoices}
