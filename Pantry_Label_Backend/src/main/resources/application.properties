spring.application.name=pantry-label-backend
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pantry_label_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&characterEncoding=utf8&connectionCollation=utf8mb4_unicode_ci}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.connection.characterEncoding=utf8
spring.jpa.properties.hibernate.connection.CharSet=utf8mb4
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
app.jwt.secret=${JWT_SECRET:pantry-label-local-dev-secret-key-change-in-production-min64chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_placeholder}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:placeholder_secret}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:dev@example.com}
spring.mail.password=${GMAIL_APP_PASSWORD:dev_placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.invoice.storage-path=${INVOICE_STORAGE_PATH:uploads/invoices}
