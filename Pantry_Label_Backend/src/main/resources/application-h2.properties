spring.application.name=pantry-label-backend
spring.datasource.url=jdbc:h2:mem:pantry_label_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:sample_data.sql
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
app.jwt.secret=${JWT_SECRET:pantry-label-local-dev-secret-key-change-in-production-min64chars}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.razorpay.key-id=${RAZORPAY_KEY_ID:rzp_test_TDpvlyoSnC3qK1}
app.razorpay.key-secret=${RAZORPAY_KEY_SECRET:Qoyi10NxPfxTn7LTn52SuLu2}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:dev@example.com}
spring.mail.password=${GMAIL_APP_PASSWORD:dev_placeholder}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.invoice.storage-path=${INVOICE_STORAGE_PATH:uploads/invoices}
